# What .travis.yml used to do, moved here unchanged in what it runs.
#
# Travis was:
#
#   before_install:
#     - sudo apt-get update
#     - sudo apt-get install -y wget curl apt-file xclip xdotool gnupg suckless-tools gnupg-agent html2text htop
#     - sudo apt-file update
#     - eval $(gpg-agent --daemon)
#   script: (cd python/tests/ && sh tools.sh) && (cd sh/tests/ && sh lib.sh && xvfb-run sh tools.sh)
#
# The script line is reproduced character for character, with one script added
# to it since; that addition is the last thing said below. Three things about
# the translation, because Travis and Actions do not run steps the same way:
#
#   - Travis ran before_install and script in one shell, so what
#     `eval $(gpg-agent --daemon)` exported was still set when the tests ran.
#     Each `run:` here is its own shell, so the assignments gpg-agent prints
#     are written to $GITHUB_ENV, which is how a variable crosses a step
#     boundary. Nothing else about that line changed, and a gpg-agent that
#     refuses because one is already running does not fail the job, as it did
#     not on Travis, where it was the first thing to start one
#   - xvfb is installed here and was not in Travis's list: Travis's image had
#     it, and `xvfb-run` comes from that package. The runner image for
#     ubuntu-24.04 ships it too, so the line is belt and braces rather than a
#     change; it is written down so nobody later reads the difference as one
#   - apt-get update and apt-file update are kept. apt-file is what
#     sh/tools/bin-dpkg-rdeps and friends look packages up with, so its
#     database has to be there, and that is the slowest step of the job
#
# This job gates, as Travis did, and its colour on a runner is not known from
# here. Measured on the machine this was written on, at this commit and with
# none of the before_install packages installed, both halves of that script
# line already fail:
#
#   (cd python/tests/ && sh tools.sh)   7 of 8 pass; simple-httpd fails
#   (cd sh/tests/ && sh lib.sh)         60 of 66 pass; _encode64,
#                                       _filesize_in_bytes, _internet,
#                                       _printfl, _unprintf and _whereis fail
#
# Which of those are the missing packages and which are real is not something
# that machine can answer: xclip, html2text, apt-file and sselp are not
# installed there and are installed here, _internet wants a network, and
# simple-httpd wants a port. The first run of this job is what will say. If it
# comes back red for a reason that is not a regression, the honest fix is to
# take the failing blocks up one at a time, not to soften this job.
#
# The third part of the line, xvfb-run sh tools.sh, could not be run there at
# all: that machine has no xvfb.
#
# sh/tests/prefix.sh is the one thing in that line Travis never ran. It tests
# the runner and not a tool, which tools.db has no way to key a block by, and
# this is the only place the sh suite is run from; it goes first because it
# takes under a second and because a runner that cut a block wrong would make
# every failure after it hard to read.
#
# act runs this job.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  suite:
    name: 'python and sh test suites (was Travis)'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install what the tools under test need
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget curl apt-file xclip xdotool gnupg \
              suckless-tools gnupg-agent html2text htop xvfb
          sudo apt-file update

      - name: Start a gpg-agent, as Travis did
        run: |
          # Travis: eval $(gpg-agent --daemon). Here the assignments have to be
          # handed to the next step, and an agent that is already running is not
          # a reason to stop
          gpg-agent --daemon > gpg-agent.env 2>/dev/null || true
          sed -n 's/^\([A-Z_][A-Z_]*\)=\([^;]*\).*$/\1=\2/p' gpg-agent.env >> "${GITHUB_ENV}"
          rm -f gpg-agent.env

      - name: Run the suites
        run: (cd python/tests/ && sh tools.sh) && (cd sh/tests/ && sh prefix.sh && sh lib.sh && xvfb-run sh tools.sh)
