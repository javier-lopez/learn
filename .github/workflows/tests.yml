# The python and sh test suites, the whole of them, on every push.
#
# Three things about the job are not obvious from reading it:
#
#   - each `run:` is its own shell, so the assignments `gpg-agent --daemon`
#     prints are written to $GITHUB_ENV, which is how a variable crosses a step
#     boundary. An agent that refuses because one is already running is not a
#     reason to stop: what the step is after is an agent to be there, and one is
#   - xvfb is installed although the ubuntu-24.04 runner image ships it, and
#     `xvfb-run` comes from that package. It is belt and braces, and it is
#     written down so nobody later reads the line as something the image lacks
#   - apt-get update and apt-file update are kept. apt-file is what
#     sh/tools/bin-dpkg-rdeps and friends look packages up with, so its
#     database has to be there, and that is the slowest step of the job
#
# What colour the job comes back on a runner is not known from here. Measured
# on the machine this was written on, at this commit and with none of the
# packages the first step installs, both halves of that script line fail:
#
#   (cd python/tests/ && sh tools.sh)   7 of 8 pass; simple-httpd fails
#   (cd sh/tests/ && sh lib.sh)         60 of 66 pass; _encode64,
#                                       _filesize_in_bytes, _internet,
#                                       _printfl, _unprintf and _whereis fail
#
# Which of those are the missing packages and which are real is not something
# that machine can answer: xclip, html2text, apt-file and sselp are not
# installed there and are installed here, _internet wants a network, and
# simple-httpd wants a port. The first run of this job is what will say. If it
# comes back red for a reason that is not a regression, the honest fix is to
# take the failing blocks up one at a time, not to soften this job.
#
# The third part of the line, xvfb-run sh tools.sh, could not be run there at
# all: that machine has no xvfb.
#
# sh/tests/meta.sh tests the runner and not a tool, which tools.db has no way
# to key a block by, and this is the only place the sh suite is run from; it
# goes first because it takes under a second and because a runner that cut a
# block wrong would make every failure after it hard to read.
#
# act runs this job.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  suite:
    name: 'python and sh test suites'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Comes out the day this job first comes out green. Until a runner has said
    # so, a red check on every commit would be noise and not news
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install what the tools under test need
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget curl apt-file xclip xdotool gnupg \
              suckless-tools gnupg-agent html2text htop xvfb
          sudo apt-file update

      - name: Start a gpg-agent by hand
        run: |
          # The assignments the agent prints have to be handed to the next step,
          # which is what $GITHUB_ENV is for, and an agent that is already
          # running is not a reason to stop
          gpg-agent --daemon > gpg-agent.env 2>/dev/null || true
          sed -n 's/^\([A-Z_][A-Z_]*\)=\([^;]*\).*$/\1=\2/p' gpg-agent.env >> "${GITHUB_ENV}"
          rm -f gpg-agent.env

      - name: Run the suites
        run: (cd python/tests/ && sh tools.sh) && (cd sh/tests/ && sh meta.sh && sh lib.sh && xvfb-run sh tools.sh)
